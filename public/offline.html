<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오프라인 — 마인드팡 이슈</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        background: #fff;
        color: #171717;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #fafafa; }
      }
      .box { text-align: center; max-width: 320px; }
      h1 { font-size: 20px; font-weight: 700; margin: 16px 0 8px; }
      p { font-size: 14px; line-height: 1.7; opacity: 0.7; margin: 0 0 20px; }
      button {
        border: 0;
        border-radius: 10px;
        background: #e14a2b;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/icon-192.png" width="56" height="56" alt="" />
      <h1>인터넷에 연결되어 있지 않아요</h1>
      <p>네트워크 연결을 확인한 뒤 다시 시도해 주세요.</p>
      <button onclick="location.reload()">다시 시도</button>
    </div>
  </body>
</html>
